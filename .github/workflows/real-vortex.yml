name: Real Vortex

# Runs the app's detector against Vortex itself. A GitHub-hosted Windows runner
# installs a Vortex release, a small local extension (tools/ci/real_vortex)
# makes Vortex show its free-download dialog, and the point the app would
# click is compared with where Vortex says it drew the button, at 100, 125 and
# 150 % scaling. The display rig (windows-displays.yml) proves coordinates on
# every monitor layout with drawn buttons; this proves the button is found as
# Vortex really renders it.
#
# No Nexus account, no login, no download, no click.
#
# Three Vortex versions:
#   2.10.1  pinned, the "Download manually" dialog
#   1.13.7  pinned, the older dialog with the orange "Download" button
#   latest  the newest stable release at run time: the nightly run is how a
#           Vortex update that changes the dialog gets noticed

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"
  # `pull_request`, never `pull_request_target`: fork PRs run without secrets.
  pull_request:
    paths:
      - "services/**"
      - "utils/**"
      - "models/**"
      - "assets/**"
      - "tools/ci/real_vortex/**"
      - "tools/ci/real_vortex_check.py"
      - "tools/ci/install_real_vortex.ps1"
      - "tools/ci/install_virtual_display_driver.ps1"
      - "tools/ci/set_display_layout.py"
      - "requirements.txt"
      - ".github/workflows/real-vortex.yml"

permissions:
  contents: read

concurrency:
  group: real-vortex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vortex:
    name: vortex-${{ matrix.vortex }}-at-${{ matrix.scale }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vortex: ["2.10.1", "1.13.7", "latest"]
        scale: [100, 125, 150]
        include:
          # SHA256 of vortex-setup-2.10.1.exe as published with the release.
          - vortex: "2.10.1"
            sha256: "01d62323acc37f0056a2752b82b26fa5992df818f4718f82ab3e3ea24d406030"
          # 1.13.7 needs two things a hosted runner lacks. The .NET 6 desktop
          # runtime: without it Vortex stops at a start-up check. And a GPU:
          # Chromium's GPU process crashes until the app gives up ("GPU
          # process isn't usable. Goodbye."), so it is kept in-process.
          # The release carries no published hash; this is the hash of the
          # installer as downloaded on 2026-11-16.
          - vortex: "1.13.7"
            sha256: "309859061f6113b4e5c7dd456be3c6df54ce9910212f6fc531b0db5a6204118d"
            args: "--in-process-gpu"
            dotnet6: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Virtual Display Driver
        shell: pwsh
        run: tools/ci/install_virtual_display_driver.ps1 -Count 1

      - name: Apply topology
        run: python tools/ci/set_display_layout.py --layout "1920x1080@0,0:${{ matrix.scale }}" --json artifacts/layout.json

      - name: Check display state
        run: python tools/ci/display_report.py --out artifacts/report --expect "1920x1080@0,0:${{ matrix.scale }}"

      - name: Install the .NET 6 runtimes
        if: ${{ matrix.dotnet6 }}
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $script
          & $script -Runtime dotnet -Channel 6.0 -InstallDir "C:\Program Files\dotnet"
          & $script -Runtime windowsdesktop -Channel 6.0 -InstallDir "C:\Program Files\dotnet"
          dotnet --list-runtimes

      - name: Install Vortex ${{ matrix.vortex }}
        id: install
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/install_real_vortex.ps1 -Version "${{ matrix.vortex }}" -Sha256 "${{ matrix.sha256 }}"

      # Exit code 2 means the dialog never showed, so nothing was tested: the
      # step fails then as well, it must not pass for the wrong reason.
      - name: Find the button in real Vortex
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/real-vortex | Out-Null
          $env:NEXUSAUTODL_RIG_OUT = (Resolve-Path artifacts/real-vortex).Path
          $launch = @{ FilePath = "${{ steps.install.outputs.exe }}" }
          if ("${{ matrix.args }}") { $launch.ArgumentList = "${{ matrix.args }}".Split(" ") }
          Start-Process @launch
          python tools/ci/real_vortex_check.py --out artifacts/real-vortex --label "Vortex ${{ steps.install.outputs.version }} at ${{ matrix.scale }} %"

      - name: Collect Vortex logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/vortex-logs | Out-Null
          Copy-Item -Path "$env:APPDATA\Vortex\*.log" -Destination artifacts/vortex-logs -ErrorAction SilentlyContinue
          Get-Process -Name Vortex -ErrorAction SilentlyContinue | Stop-Process -Force

      # Small on purpose: the verdict and where Vortex drew its buttons,
      # without the frames.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-vortex-${{ matrix.vortex }}-at-${{ matrix.scale }}
          path: |
            artifacts/real-vortex/results.json
            artifacts/real-vortex/vortex-dialog.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frames and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-vortex-${{ matrix.vortex }}-at-${{ matrix.scale }}
          path: artifacts/
          retention-days: 14
